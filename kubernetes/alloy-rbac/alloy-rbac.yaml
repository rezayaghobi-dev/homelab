apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-external
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-external
rules:
- apiGroups: [""]
  resources: ["pods","pods/log","namespaces"]
  verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-external
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-external
subjects:
- kind: ServiceAccount
  name: alloy-external
  namespace: monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: alloy-external-token
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: alloy-external
type: kubernetes.io/service-account-token
