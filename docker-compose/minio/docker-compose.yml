services:
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z-cpuv1
    container_name: minio
    restart: unless-stopped
    ports:
      - "9500:9000"
      - "9501:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: change this 
    volumes:
      - ./data:/data
    command: server /data --console-address ":9001"
    mem_limit: 256m
