services:
  agent-canvas:
    image: ghcr.io/openhands/agent-canvas:latest
    container_name: agent-canvas
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - openhands-data:/home/openhands/.openhands
      - ./projects:/home/openhands/workspace/project
    stdin_open: true
    tty: true
    depends_on:
      - github-mcp

  github-mcp:
    image: ghcr.io/github/github-mcp-server:latest
    container_name: github-mcp
    restart: unless-stopped
    ports:
      - "8083:8083"
    stdin_open: true
    tty: true
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}

volumes:
  openhands-data:
