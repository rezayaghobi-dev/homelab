global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'gitlab'
    metrics_path: '/-/metrics'
    static_configs:
      - targets: ['192.168.100.6:8929']
  - job_name: 'gitlab-runner'
    static_configs:
      - targets: ['192.168.100.6:9252'] # Or your runner container name/IP

  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['192.168.100.6:30900']

  - job_name: 'k3s-kubelet-cadvisor'
    scheme: https
    metrics_path: /metrics/cadvisor
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /etc/prometheus/k3s-token
    static_configs:
      - targets: ['192.168.100.6:10250']
