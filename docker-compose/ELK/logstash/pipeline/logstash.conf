input {
  beats {
    port => 5044
  }
}

filter {
  # Add your grok/mutate/etc filters here as you get to that lesson.
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user  => "elastic"
    password => "${ELASTICSEARCH_PASSWORD}"
    index => "logstash-%{+YYYY.MM.dd}"
  }

  # Comment this out once you trust the pipeline — it's just here so you
  # can see events flowing while you're learning.
  stdout {
    codec => rubydebug
  }
}
