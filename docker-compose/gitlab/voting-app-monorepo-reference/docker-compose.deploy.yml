services:
  redis:
    image: redis:7-alpine
    mem_limit: 64m

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    mem_limit: 128m

  vote:
    image: "${CI_REGISTRY_IMAGE}/vote:${IMAGE_TAG}"
    ports:
      - "${VOTE_PORT}:80"
    depends_on:
      - redis
    mem_limit: 96m

  result:
    image: "${CI_REGISTRY_IMAGE}/result:${IMAGE_TAG}"
    ports:
      - "${RESULT_PORT}:80"
    depends_on:
      - db
    mem_limit: 96m

  worker:
    image: "${CI_REGISTRY_IMAGE}/worker:${IMAGE_TAG}"
    depends_on:
      - redis
      - db
    mem_limit: 128m

volumes:
  db-data:
